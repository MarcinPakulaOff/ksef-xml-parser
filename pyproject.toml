[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ksef-xml-parser"
version = "0.1.0"
description = "Parse Polish KSeF e-invoices (FA(3) XML) into typed records, CSV and monthly totals."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marcin Pakuła" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ksef-xml = "ksef_xml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
